[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S107"]
"tests/settings.py" = ["S105"]
"gunicorn.conf.py" = ["S104", "S108"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
