# Local development only. Values come from an untracked .env file (see .env.example).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Static files, as on Cloudflare Pages. The browser calls the API directly,
  # so SITE_ORIGIN in .env should be http://localhost:3000 for the admin.
  web:
    build:
      context: ./web
      args:
        API_BASE_URL: http://localhost:8000
    <<: *hardening
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    <<: *hardening
    tmpfs: [/tmp]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:?set AUDIT_CHAIN_KEY in .env}
      DJANGO_ALLOWED_HOSTS: api,localhost,127.0.0.1
      SITE_ORIGIN: ${SITE_ORIGIN:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_EMAIL: ${CF_ACCESS_EMAIL:-}
      BOOTSTRAP_TOKEN_SHA256: ${BOOTSTRAP_TOKEN_SHA256:-}
      NOTIFIERS: ${NOTIFIERS:-core.notify.LogNotifier}
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE: local
      MEDIA_ROOT: /media
      CACHE_PURGER: core.purge.LogPurger
      SITE_DEPLOYER: core.deploy.LogDeployer
    volumes: [media-data:/media]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  media-data:
